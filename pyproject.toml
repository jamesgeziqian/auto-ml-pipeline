[project]
name = "auto-ml-pipeline"
version = "0.1.0"
description = "Chunked, configuration-driven auto machine learning pipeline for wide tabular data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "xgboost>=2.0,<4",
  "optuna>=3.6",
  "PyYAML>=6.0",
  "psutil>=5.9",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
auto-ml = "auto_ml_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_ml_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

